[workspace]
resolver = "2"
members = ["crates/cli", "crates/oauth-login", "generator"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/origincloudhq/cli"
homepage = "https://origincloud.eu"

[workspace.dependencies]
# The Rust SDK, at the commit whose API_REVISION is this repository's
# API_REVISION: the generated commands use its request and response types,
# so the two must come from the same API definitions. scripts/update.sh moves
# both together, and scripts/generate.sh --check fails when they differ.
origincloud-core = { git = "https://github.com/origincloudhq/sdk-rust", rev = "7ad1c490abf23f3e48f6df22f71c91cf06d108eb" }
origincloud-pvs = { git = "https://github.com/origincloudhq/sdk-rust", rev = "7ad1c490abf23f3e48f6df22f71c91cf06d108eb" }
origincloud-location = { git = "https://github.com/origincloudhq/sdk-rust", rev = "7ad1c490abf23f3e48f6df22f71c91cf06d108eb" }
fake-server = { git = "https://github.com/origincloudhq/sdk-rust", rev = "7ad1c490abf23f3e48f6df22f71c91cf06d108eb" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
graphql_client = { version = "0.14", default-features = false, features = ["graphql_query_derive"] }
http = "1"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
