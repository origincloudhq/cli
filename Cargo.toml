[workspace]
resolver = "2"
members = ["crates/cli", "crates/oauth-login", "generator", "testing/scratch/sdk"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/origincloudhq/cli"
homepage = "https://origincloud.eu"

[workspace.dependencies]
# The Rust SDK, at the commit whose API_REVISION is this repository's
# API_REVISION: the generated commands use its request and response types,
# so the two must come from the same API definitions. scripts/update.sh moves
# both together, and scripts/generate.sh --check fails when they differ.
origincloud-core = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
origincloud-pvs = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
origincloud-location = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
origincloud-compute = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
origincloud-network = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
origincloud-resourcemanager = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
fake-server = { git = "https://github.com/origincloudhq/sdk-rust", rev = "3c3e935e0ea47ee23d7881a44cd7132eb759b5fc" }
# The MCP tools `origin mcp serve` serves, at a commit built on the same SDK
# commit as the lines above: the CLI hands them the SDK's `Client`, so both
# must be the same crate. scripts/update.sh moves the three together, and
# scripts/generate.sh --check fails when they differ.
origincloud-mcp = { git = "https://github.com/origincloudhq/mcp", rev = "f6942684fd7acf3bfc5c79f8a567b58d704bc441" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
graphql_client = { version = "0.14", default-features = false, features = ["graphql_query_derive"] }
http = "1"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "form", "rustls"] }
# The MCP protocol; `origin mcp serve` adds its transport.
rmcp = { version = "3", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
