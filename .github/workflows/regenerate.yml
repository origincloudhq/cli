# Keeps the CLI current with the API: daily, and when run by hand,
# scripts/update.sh moves it to the head of origincloudhq/mcp, the
# origincloudhq/sdk-rust commit that is built on and the API revision that
# was generated from, and generates the commands again.
# When that changes anything, the result is one pull request from the branch
# `regenerate`, refreshed by each later run until it is merged; when it
# changes nothing, an open one is closed.
#
# Commits someone adds to that pull request, such as a generator change a
# new method needs, are kept: a later run generates on top of them, with
# main merged in, and never closes a pull request that has them. Merging
# main resolves conflicts in what scripts/update.sh writes again anyway
# (API_REVISION, Cargo.lock, crates/cli/src/sdk/generated, and the scratch
# service's testing/scratch/sdk/src/generated and Cargo.toml); any other
# conflict fails the run until someone merges main into the branch by hand.
#
# When generation fails, such as on a field the generator can't make a flag
# of, the pull request is opened or refreshed all the same, with the SDK and
# API_REVISION moved alone, the generated code left as it was, and the
# generator's error in its description; then the run fails. A fix pushed to
# that branch is kept, as any added commit is, and the next run generates
# with it.
#
# Once CI passes on the pull request, merge-regeneration.yml merges it when
# it holds only this workflow's commits. Releases of the CLI are made by
# hand (RELEASING.md).
#
# It runs when origincloudhq/mcp's main moves (its downstream.yml dispatches
# it), and daily as a fallback.
#
# With the regeneration App configured (the variable REGENERATE_APP_ID and
# the secret REGENERATE_APP_PRIVATE_KEY), the branch is pushed and the pull
# request opened with the App's token, so that CI runs on the pull request.
# Without it, the workflow token opens the pull request, which starts no
# pull_request run, so this dispatches CI on the branch; its result shows on
# the pull request's commit, and the pull request is merged by hand. Opening
# it with the workflow token needs "Allow GitHub Actions to create and
# approve pull requests" in the repository's Actions settings.
name: Regenerate

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: regenerate
    steps:
      - name: App token
        id: app
        if: vars.REGENERATE_APP_ID != ''
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: ${{ vars.REGENERATE_APP_ID }}
          private-key: ${{ secrets.REGENERATE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: 'actions/checkout@v4'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      # The open pull request's branch, when someone has added commits to
      # it, with main merged in; main otherwise.
      - name: Base
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          echo "PREVIOUS=$(cat API_REVISION)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bot="$(git config user.email)"
          base=main
          lease=""
          # Exit status 2: there is no such branch. Any other failure fails
          # the run rather than passing for an absent branch.
          found=0
          git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null || found=$?
          if [[ "${found}" -eq 0 ]]; then
            git fetch --quiet origin "${BRANCH}"
            lease="$(git rev-parse FETCH_HEAD)"
            open="$(gh pr list --head "${BRANCH}" --base main --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not))[0].number // empty')"
            # Committers too: an amended or rebased commit of the workflow's
            # keeps it as the author.
            added="$(git log --format='%ae%n%ce' origin/main..FETCH_HEAD | grep -cvxF "${bot}" || true)"
            if [[ -n "${open}" && "${added}" -gt 0 ]]; then
              git switch --quiet -C "${BRANCH}" FETCH_HEAD
              if ! git merge --quiet --no-edit origin/main; then
                for path in $(git diff --name-only --diff-filter=U); do
                  case "${path}" in
              API_REVISION | Cargo.lock | crates/cli/src/sdk/generated/* | testing/scratch/sdk/src/generated/* | testing/scratch/sdk/Cargo.toml)
                      if git checkout --quiet --ours -- "${path}" 2>/dev/null; then
                        git add -- "${path}"
                      else
                        git rm --quiet -- "${path}"
                      fi
                      ;;
                  esac
                done
                conflicts="$(git diff --name-only --diff-filter=U | paste -sd ' ' -)"
                if [[ -n "${conflicts}" ]]; then
                  echo "::error::merging main into ${BRANCH} conflicts in ${conflicts}: merge main into it by hand and push"
                  exit 1
                fi
                git commit --quiet --no-edit
              fi
              base=branch
            fi
          elif [[ "${found}" -ne 2 ]]; then
            echo "::error::could not read origin's branches"
            exit 1
          fi
          {
            echo "BASE=${base}"
            echo "LEASE=${lease}"
            echo "FROM=$(cat API_REVISION)"
          } >> "$GITHUB_ENV"

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust
        run: rustup toolchain install

      - name: Cache
        uses: 'Swatinem/rust-cache@v2'

      # A failed generation keeps the SDK's and API_REVISION's moves alone,
      # and its error for the pull request; the run fails at its end.
      - name: Update
        run: |
          set -euo pipefail
          status=0
          # Both streams: generate.sh says FAILED on standard output.
          scripts/update.sh > "${RUNNER_TEMP}/update.log" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/update.log"
          if [[ "${status}" -eq 0 ]]; then
            exit 0
          fi
          kept=(API_REVISION Cargo.toml Cargo.lock)
          mkdir -p "${RUNNER_TEMP}/kept"
          cp "${kept[@]}" "${RUNNER_TEMP}/kept/"
          git checkout --quiet -- .
          git clean --quiet -fd
          for file in "${kept[@]}"; do cp "${RUNNER_TEMP}/kept/${file}" "${file}"; done
          delimiter="FAILURE_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "FAILURE<<${delimiter}"
            { grep -v '^\s*$' "${RUNNER_TEMP}/update.log" || true; } | tail -n 40
            echo "${delimiter}"
          } >> "$GITHUB_ENV"

      - name: Pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          WITH_APP: ${{ steps.app.outputs.token != '' }}
        run: |
          set -euo pipefail
          open="$(gh pr list --head "${BRANCH}" --base main --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not))[0].number // empty')"
          if [[ "${BASE}" == main && -z "$(git status --porcelain)" && -z "${FAILURE:-}" ]]; then
            echo "already current"
            # The branch goes only as the Base step found it, and its pull
            # request closes with it; one pushed to meanwhile stays.
            if [[ -n "${LEASE}" ]]; then
              if git push --quiet --force-with-lease="${BRANCH}:${LEASE}" origin ":${BRANCH}"; then
                if [[ -n "${open}" ]]; then
                  gh pr comment "${open}" --body "main is current with the API."
                fi
              else
                echo "::warning::${BRANCH} changed during the run; left as it is"
              fi
            fi
            exit 0
          fi

          # A failure before anything moved has nothing to push: the branch
          # and its pull request stay as they are, which hears of it.
          if [[ -n "${FAILURE:-}" && -z "$(git status --porcelain)" ]]; then
            if [[ -n "${open}" ]]; then
              fence='```'
              gh pr comment "${open}" --body "A run failed before moving anything; scripts/update.sh said:

          ${fence}
          ${FAILURE}
          ${fence}"
            fi
            exit 0
          fi

          revision="$(cat API_REVISION)"
          git switch --quiet -C "${BRANCH}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            if [[ -n "${FAILURE:-}" ]]; then
              git commit --quiet -m "Move to origincloudhq/api@${revision:0:12}; generation fails" \
                -m "API: https://github.com/origincloudhq/api/compare/${FROM}...${revision}" \
                -m "The generated code is left as it was: see the pull request."
            else
              git commit --quiet -m "Regenerate from origincloudhq/api@${revision:0:12}" \
                -m "API: https://github.com/origincloudhq/api/compare/${FROM}...${revision}"
            fi
          fi

          # Unchanged since the last run: nothing to push or check again,
          # but a failure's description is refreshed.
          if [[ -n "${LEASE}" ]] && git diff --quiet "${LEASE}" HEAD && [[ -z "${FAILURE:-}" ]]; then
            echo "pull request #${open:-?} is current"
            exit 0
          fi
          # Replaces the branch only as this run found it: a commit pushed
          # meanwhile fails the run instead of being lost.
          if ! git diff --quiet "${LEASE:-HEAD}" HEAD || [[ -z "${LEASE}" ]]; then
            git push --quiet --force-with-lease="${BRANCH}:${LEASE}" origin "${BRANCH}"
          fi

          body="Generated from [origincloudhq/api@${revision:0:12}](https://github.com/origincloudhq/api/commit/${revision}) ([changes](https://github.com/origincloudhq/api/compare/${PREVIOUS}...${revision})) by scripts/update.sh.

          The MCP tools are moved to their newest commit, the Rust SDK to the commit they are built on, and API_REVISION to the API revision that commit was generated from.

          If CI fails, the API uses something the generator (generator/) doesn't support yet, such as a method it can't make a command for; extend it on this branch."
          if [[ -n "${FAILURE:-}" ]]; then
            fence='```'
            body="Moves to [origincloudhq/api@${revision:0:12}](https://github.com/origincloudhq/api/commit/${revision}) ([changes](https://github.com/origincloudhq/api/compare/${PREVIOUS}...${revision})), but **generation fails**, so this moves the Rust SDK and API_REVISION alone and leaves the generated code as it was. scripts/update.sh said:

          ${fence}
          ${FAILURE}
          ${fence}

          Extend the generator (generator/) on this branch, or leave the method or the field out in generator/commands.toml with the reason, and run scripts/generate.sh. Commits added here are kept by later runs, which generate with them."
          fi
          if [[ -n "${open}" ]]; then
            gh pr edit "${open}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "Regenerate from the latest API" --body "${body}"
          fi
          # The App's push starts CI on the pull request; the workflow
          # token's doesn't.
          if [[ "${WITH_APP}" != true ]]; then
            gh workflow run ci.yml --ref "${BRANCH}"
          fi

      - name: Generation
        if: env.FAILURE != ''
        run: |
          echo "::error::generation failed; the regenerate pull request has the error"
          exit 1
