# Checks every pull request and every push to main: the generated commands
# are what the pinned API definitions generate (scripts/generate.sh
# --check), the code is formatted and lint-free, and the tests pass,
# among them the one checking that every method of the API has a command.
# It also makes everything a release would publish (build.yml), without
# publishing it.
#
# The regeneration pull request is opened with the workflow token, which
# starts no pull_request run, so regenerate.yml dispatches this workflow on
# its branch instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust
        run: rustup toolchain install

      - name: Cache
        uses: 'Swatinem/rust-cache@v2'

      - name: Generated code
        run: scripts/generate.sh --check

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      # The flags of nested and repeated fields, which the published API
      # doesn't have yet, through the tests' scratch service: its group is
      # compiled with the test-services feature only.
      - name: Test services
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p origincloud-cli --all-features

      - name: Scripts
        run: shellcheck scripts/*.sh release/*.sh

      - name: Release scripts
        run: for test in release/*.test.sh; do "${test}"; done

  build:
    uses: ./.github/workflows/build.yml
