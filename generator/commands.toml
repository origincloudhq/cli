# Choices about the generated commands that the API definitions don't
# express. The generator applies them; CONTRIBUTING.md describes them.
#
# An entry names a service as its packages name it (`pvs` for
# `origincloud.pvs.v1beta1`, `longrunning` for the operation methods), a
# method of it (`ImportVolume`) and, for a field, a path from its request
# (`volume.source_snapshot`). The coverage test fails when an entry names a
# service, a method or a field the API doesn't have, so that an entry can't
# silently stop applying.

# The hand-written groups the CLI still has: the ones calling the GraphQL
# API until the API has the service replacing each (`iam`), and the CLI's
# own (`config`, `id`, `mcp`, `version`). A service of the API named like
# one (`iam`), or replacing one under another name ([[replacement]] below),
# fails generation until that group is retired in the same change, as
# CONTRIBUTING.md says. The coverage test checks this list is the CLI's.
hand_written = ["config", "iam", "id", "mcp", "version"]

# A service replacing a hand-written group under another name. It is written
# before the API has the service, so that generation fails as soon as a
# regeneration brings it. The coverage test fails when the group isn't one
# the CLI has had (crates/cli/tests/hand_written.txt).
[[replacement]]
group = "admin"
service = "resourcemanager"

# The help of a command group, when the API's comments don't give it: a
# package with one service takes it from that service's comment, so only a
# package with several needs an entry.
[[service]]
name = "pvs"
about = "Persistent volume service: volumes, snapshots and storage classes"
details = """
Resource names are given as their parts (`--project`, `--zone`, `--volume`), \
or the resource's flag takes a whole name; `--project` and `--zone` default \
to the profile's `default-project` and `default-zone`."""

[[service]]
name = "compute"
about = "Compute service: instances, images, key pairs, volume attachments, and the instance types and image families on offer"
details = """
Resource names are given as their parts (`--project`, `--zone`, `--instance`), \
or the resource's flag takes a whole name; `--project` and `--zone` default \
to the profile's `default-project` and `default-zone`."""

[[service]]
name = "network"
about = "Network service: VPCs, subnets, route tables, ACLs, security groups, gateways, floating IPs, network interfaces and DNS policies"
details = """
Resource names are given as their parts (`--project`, `--region` or \
`--zone`, `--vpc`), or the resource's flag takes a whole name. VPCs, route \
tables, ACLs, security groups, internet gateways and DNS policies are \
regional (`--region`); subnets, network interfaces, floating IPs and NAT \
gateways are zonal (`--zone`). `--project`, `--zone` and `--region` \
default to `ORIGINCLOUD_PROJECT`, `ORIGINCLOUD_ZONE` and `ORIGINCLOUD_REGION`, \
else to the profile's `default-project`, `default-zone` and `region`; \
`--region`, else to the region of the default zone."""

[[service]]
name = "resourcemanager"
about = "Resource manager: organizations and projects, and their quotas"

# A reference field that also takes the names of another resource type than
# the one its definition declares: a `google.api.resource_reference` names
# one type only. Its flag (or key) then takes a whole name of either type; an
# id still completes to the declared type's pattern, which its help says. The
# entry names the field by its full name, wherever it appears, and the other
# type; generation fails, and so does the coverage test, when the field isn't
# a reference to a type the API declares, or the type isn't one.
[[also_names]]
field = "origincloud.compute.v1beta1.Instance.image"
resource = "compute.origincloudapis.eu/PublicImage"
why = "An instance boots from one of the project's own images or a public one, `zones/{zone}/images/{image}`, as the field's comment says; its reference declares the project's own alone."

