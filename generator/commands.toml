# Choices about the generated commands that the API definitions don't
# express. The generator applies them; CONTRIBUTING.md describes them.
#
# An entry names a service as its packages name it (`pvs` for
# `origincloud.pvs.v1beta1`, `longrunning` for the operation methods), a
# method of it (`ImportVolume`) and, for a field, a path from its request
# (`volume.source_snapshot`). The coverage test fails when an entry names a
# service, a method or a field the API doesn't have, so that an entry can't
# silently stop applying.

# The hand-written groups the CLI still has: the ones calling the GraphQL
# API until the API has the service replacing each (`admin`, `compute`,
# `iam`, `network`, `storage`), and the CLI's own (`config`, `id`, `mcp`,
# `version`). A service of the API named like one (`compute`), or replacing
# one under another name ([[replacement]] below), fails generation until
# that group is retired in the same change, as CONTRIBUTING.md says. The
# coverage test checks this list is the CLI's.
hand_written = ["admin", "compute", "config", "iam", "id", "mcp", "network", "storage", "version"]

# A service replacing a hand-written group under another name. It is written
# before the API has the service, so that generation fails as soon as a
# regeneration brings it. The coverage test fails when the group isn't one
# the CLI has had (crates/cli/tests/hand_written.txt).
[[replacement]]
group = "admin"
service = "resourcemanager"

# The help of a command group, when the API's comments don't give it: a
# package with one service takes it from that service's comment, so only a
# package with several needs an entry.
[[service]]
name = "pvs"
about = "Persistent volume service: volumes, snapshots and storage classes"
details = """
Resource names are given as their parts (`--project`, `--zone`, `--volume`), \
or the resource's flag takes a whole name; `--project` and `--zone` default \
to the profile's `default-project` and `default-zone`."""

# A hand-written command the CLI no longer has, which no command of the same
# name replaces (a generated `origin compute get-instance` replaces the
# hand-written one), with the reason and what to use instead. Every command
# crates/cli/tests/hand_written.txt lists is a command of the CLI or has an
# entry here: the coverage test fails for one gone without an entry, and for
# an entry naming a command the CLI still has or never had.
#
# [[retired]]
# group = "admin"
# command = "register-organisation"
# why = "Signing up creates the organization; resourcemanager's create-organization creates more."

# Methods left without a command, with the reason. Every other method of the
# API has one: the coverage test fails for a method that has neither.
#
# [[no_command]]
# service = "pvs"
# method = "ExampleMethod"
# why = "Why the CLI doesn't offer it."

# Fields left out of a method's command, because the method doesn't take
# them although its request message has them.
[[exclude]]
service = "pvs"
method = "ImportVolume"
field = "volume.source_snapshot"
why = "An import's content is the downloaded image: it takes a size, a storage class and tags."

# Changes that can't be undone. A command that sets one of these fields
# requires `--yes`, like a delete, and refuses before sending anything
# without it. Every delete requires `--yes` anyway, without an entry here.
[[one_way]]
service = "pvs"
method = "UpdateVolume"
field = "volume.size_gib"
verb = "grow"
consequence = "A volume never shrinks back, and its larger size is charged."
