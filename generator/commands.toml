# Methods left without a command, with the reason. Every other method of the
# API has one: the coverage test fails for a method that has neither.
#
# [[no_command]]
# service = "pvs"
# method = "ExampleMethod"
# why = "Why the CLI doesn't offer it."

# Fields left out of a method's command, because the method doesn't take
# them although its request message has them.
[[exclude]]
service = "pvs"
method = "ImportVolume"
field = "volume.source_snapshot"
why = "An import's content is the downloaded image: it takes a size, a storage class and tags."

# Changes that can't be undone. A command that sets one of these fields
# requires `--yes`, like a delete, and refuses before sending anything
# without it. Every delete requires `--yes` anyway, without an entry here.
[[one_way]]
service = "pvs"
method = "UpdateVolume"
field = "volume.size_gib"
verb = "grow"
consequence = "A volume never shrinks back, and its larger size is charged."

# A field of a method's response holding a secret the API returns in that
# response alone, such as a generated private key. The command prints the
# response as any other does and, when the field isn't empty, says `notice`
# on standard error: that it can't be had again, and how to keep it.
[[shown_once]]
service = "compute"
method = "CreateKeyPair"
field = "private_key"
notice = """
`privateKey` holds the generated private key, which the API returns this \
once: the platform keeps only the public key. Save it now to a file only you \
can read, such as by piping the output through \
`(umask 077; jq -r .privateKey > my-key)`. A lost key can't be fetched \
again: delete the key pair and create another."""

# The columns of the `table` a list of a message is printed as, by the
# fields' paths from the message, through messages and lists of them:
# what tells one item from another, and what someone listing them looks
# for first. Without a view, a table shows every field the message defines
# that fits in a cell, but its urn, its creator and its maps; `wide` shows
# all of those after a view's. Generation fails for a view naming a field
# the message doesn't have, or one that doesn't fit in a cell.
[[view]]
service = "compute"
message = "Instance"
columns = ["name", "state", "instance_type", "image_family", "interface_addresses.ipv4_address", "create_time"]

