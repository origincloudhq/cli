# Choices about the `origin pvs` commands that the API definitions don't
# express. The generator applies them; CONTRIBUTING.md describes them.
#
# Each entry names a method of the PVS API (`ImportVolume`) and a field of
# its request, as a path (`volume.source_snapshot`). The coverage test fails
# when an entry names a method or a field the API doesn't have, so that an
# entry can't silently stop applying.

# Fields left out of a method's command, because the method doesn't take
# them although its request message has them.
[[exclude]]
method = "ImportVolume"
field = "volume.source_snapshot"
why = "An import's content is the downloaded image: it takes a size, a storage class and tags."

# Changes that can't be undone. A command that sets one of these fields
# requires `--yes`, like a delete, and refuses before sending anything
# without it. Every delete requires `--yes` anyway, without an entry here.
[[one_way]]
method = "UpdateVolume"
field = "volume.size_gib"
verb = "grow"
consequence = "A volume never shrinks back, and its larger size is charged."
