mutation UpdateSubnetAutoAssignPublicIp(
    $input: NetworkUpdateSubnetAutoAssignPublicIpInput!
) {
    network {
        updateSubnetAutoAssignPublicIp(input: $input) {
            id
            urn
            vpcId
            aclUrn
            availabilityZone
            ipv6Network {
                networkCidr
                totalSubnets
                availableSubnets
                subnetPrefixLength
            }
            ipv6Router
            ipv6DnsServers
            ipv4Network {
                networkCidr
                totalSubnets
                availableSubnets
                subnetPrefixLength
            }
            ipv4Router
            ipv4DnsServers
            autoAssignPublicIp
            createdAt
            createdBy
        }
    }
}
