mutation CreateAcl($input: NetworkCreateAclInput!) {
    network {
        createAcl(input: $input) {
            id
            urn
            name
            tags {
                key
                value
            }
            vpcId
            isDefault
            rules {
                priority
                direction
                protocol
                port
                source
                policy
            }
            createdAt
            createdBy
        }
    }
}
