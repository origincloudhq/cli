mutation CreateNetworkInterface($input: NetworkCreateNetworkInterfaceInput!) {
    network {
        createNetworkInterface(input: $input) {
            id
            urn
            name
            tags {
                key
                value
            }
            availabilityZone
            ipv6Address
            ipv6AddressPrefix
            ipv6AddressCidr
            ipv4Address
            ipv4AddressPrefix
            ipv4AddressCidr
            status
            attachedToUrn
            sourceAddressCheck
            securityGroupUrns
            creationTime
            createdBy
        }
    }
}
