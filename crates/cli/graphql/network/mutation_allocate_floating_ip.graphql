mutation AllocateFloatingIp($input: NetworkAllocateFloatingIpInput!) {
    network {
        allocateFloatingIp(input: $input) {
            id
            urn
            name
            tags {
                key
                value
            }
            availabilityZone
            address
            networkInterfaceUrn
            privateAddress
            createdAt
            createdBy
        }
    }
}
