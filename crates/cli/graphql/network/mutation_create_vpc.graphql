mutation CreateVpc($input: NetworkCreateVpcInput!) {
    network {
        createVpc(input: $input) {
            id
            urn
            name
            tags {
                key
                value
            }
            networks {
                networkCidr
                totalSubnets
                availableSubnets
                subnetPrefixLength
            }
            ipv4Network {
                networkCidr
                totalSubnets
                availableSubnets
                subnetPrefixLength
            }
            createdAt
            createdBy
        }
    }
}