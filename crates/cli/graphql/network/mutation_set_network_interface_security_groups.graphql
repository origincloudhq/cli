mutation SetNetworkInterfaceSecurityGroups(
    $input: NetworkSetNetworkInterfaceSecurityGroupsInput!
) {
    network {
        setNetworkInterfaceSecurityGroups(input: $input) {
            id
            urn
            availabilityZone
            ipv6Address
            ipv6AddressPrefix
            ipv6AddressCidr
            ipv4Address
            ipv4AddressPrefix
            ipv4AddressCidr
            status
            attachedToUrn
            sourceAddressCheck
            securityGroupUrns
            creationTime
            createdBy
        }
    }
}
