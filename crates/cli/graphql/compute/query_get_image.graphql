query GetImage($imageUrn: Urn!) {
    compute {
        image(imageUrn: $imageUrn) {
            __typename
            ... on ComputeImage {
                urn
                name
                tags {
                    key
                    value
                }
                imageId
                description
                defaultUser
                architecture
                platform
                status
                createdBy
            }
            ... on ComputePublicImage {
                urn
                imageId
                description
                defaultUser
                architecture
                platform
                status
                family
                isFamilyCurrent
                createdBy
            }
        }
    }
}
