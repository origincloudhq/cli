query ListInstances($input: ComputeListInstancesInput!) {
    compute {
        instances(input: $input) {
            id
            urn
            name
            tags {
                key
                value
            }
            instanceId
            availabilityZone
            instanceType
            loginUser
            status
            statusReason
            healthChecks {
                availability
                checks {
                    kind
                    category
                    status
                    since
                }
            }
            createdBy
            networkInterfaceAttachments {
                id
                urn
                networkInterfaceUrn
                deviceIndex
                status
            }
        }
    }
}
