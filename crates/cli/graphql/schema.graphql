type PvsVolume {
	id: ID!
	urn: Urn!
	volumeId: String!
	sizeInGib: Int!
	availabilityZone: String!
	storageClass: String!
	status: String!
	"""
	When `status` is `INUSE`, the `id` of the volume attachment holding
	this volume; `null` otherwise. To find the instance, pass this
	volume's `urn` and its project's URN to the `volumeAttachments`
	query and take the entry whose `id` matches: its `instanceUrn` is
	the instance the volume is attached to.
	"""
	claimRef: String
	"""
	Why the volume is in `ERROR`: its backing image could not be created
	or could not be removed. `null` for every other status.
	"""
	statusReason: String
	"""
	Whether a modification - today only a resize - is in flight,
	finished, or failed: `COMPLETED`, `RESIZING`, `FAILED`, or the
	legacy `MODIFYING`.
	"""
	modificationStatus: String!
	"""
	Why the last modification failed, when `modificationStatus` is
	`FAILED`. The volume itself is unaffected: its data is intact and
	`sizeInGib` still reports the size it really has.
	"""
	modificationStatusReason: String
	"""
	The size a resize in flight is heading for. `sizeInGib` changes only
	once the resize is confirmed, so comparing the two distinguishes
	"still in progress" from "did not happen".
	"""
	pendingSizeInGib: Int
	"""
	Why this volume is still here after the instance it was attached to
	was terminated, when it was created with the instance and would
	normally have been deleted alongside it. `null` in every other case,
	including a volume you created yourself.
	
	The volume is a normal, usable volume: it is `AVAILABLE`, it is
	yours, and it is billed. Nothing was destroyed to keep it - most
	often it is still here because a snapshot of it exists, and a
	snapshot depends on its volume's stored data. Delete the snapshots
	and then the volume if you no longer want either.
	"""
	retentionNote: String
	"""
	The most I/O operations per second this volume serves, reads and
	writes combined. A ceiling, not a guaranteed rate: the storage
	cluster behind it is shared. Set from the storage class's
	`baselineIops` when the volume is created. `null` when the volume is
	not limited, which is always the case for host-local volumes.
	"""
	iops: Int
	"""
	The most data per second this volume transfers, in MiB/s (1 MiB =
	1,048,576 bytes), reads and writes combined. A ceiling, not a
	guaranteed rate. Set from the storage class's
	`baselineThroughputMibps` when the volume is created. `null` when
	the volume is not limited, which is always the case for host-local
