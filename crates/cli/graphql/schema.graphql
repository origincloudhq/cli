	id: ID!
	urn: Urn!
	keyPairId: String!
	name: String!
	publicKey: String!
	createdBy: Principal!
	"""
	The generated OpenSSH private key, in PEM form. Returned only here,
	only once: the platform stores only the public half, so this can
	never be retrieved again through `keyPair`/`keyPairs`. Save it now.
	"""
	privateKey: String!
}

type ComputeImage {
	id: ID!
	urn: Urn!
	imageId: String!
	description: String!
	architecture: ImageArchitectureValue!
	platform: ImagePlatformValue!
	"""
	The account to log in as on an instance launched from this image:
	the non-root user created at first boot, holding the launch's SSH
	key.
	"""
	defaultUser: String!
	status: ImageStatusValue!
	createdBy: Principal!
	"""
	Its tags, in key order.
	"""
	tags: [ResourceTag!]!
	"""
	Its `origin:name` tag, or `null` when it has none.
	"""
	name: String
}

type ComputeImageFamily {
	id: ID!
	urn: Urn!
	"""
	The name to pass to `launchInstance` as `imageFamily`, e.g.
	`"ubuntu-22-04-minimal"`. Stable: it is never renamed, and never
	reused for a different definition.
	"""
	slug: String!
	"""
	Who publishes the upstream release, e.g. `"Canonical"`.
	"""
	vendor: String!
	"""
	The operating system this family tracks, e.g. `"ubuntu"`.
	"""
	os: String!
	"""
	The release, e.g. `"22.04"`.
	"""
	osVersion: String!
	description: String!
	"""
	When the upstream vendor stops supporting this release, if a date is
	known. Advisory: launches are not refused on it, and instances
	already running are unaffected. Treat it as notice to plan a move to
	a newer family.
	"""
	supportEndsAt: DateTime
}

input ComputeImportKeyPairInput {
	projectUrn: Urn!
	name: String!
	"""
	Full OpenSSH public key line, e.g. `ssh-ed25519 AAAA... comment`.
	"""
	publicKey: String!
}

type ComputeInstance {
	id: ID!
	urn: Urn!
	instanceId: String!
	availabilityZone: String!
	"""
	Whether the platform can currently confirm this instance is
	working, which is a different question from `status`: `status` is
	what was asked for or confirmed, this is what is observed. Neither
	implies the other — a `RUNNING` instance on an unreachable host is
	still `RUNNING`.
	"""
	healthChecks: InstanceHealthChecks!
	status: InstanceStatusValue!
	"""
	Why the instance is in `FAILED`: the host refused or never confirmed
	a start, stop or shutdown, the instance could not be placed on a
	machine, or a volume or network interface it needs could not be
	created or attached.
	
	Also set on a `STOPPED` instance that went down because the machine
	it was running on failed. A `STOPPED` instance you stopped yourself,
	that shut itself down, or that the platform stopped to move it to
	another machine carries none. `null` for every other status, and
	starting the instance clears it.
	
	Always a curated classification, never raw hypervisor output or
	another service's internal error text.
	
	`null` on a `FAILED` instance means it failed before reasons were
	recorded, not that the reason is unknown - every route into `FAILED`
	records one now.
	"""
	statusReason: String
	"""
	The resolved instance type this instance was launched with, e.g.
	`"gp1.core.2"`.
	"""
	instanceType: String!
	createdBy: Principal!
	"""
	When the instance was created. Use it to derive uptime.
	"""
	createdAt: DateTime!
	"""
	The account to log in as: the non-root user created on this
	instance at first boot and holding its SSH key. Fixed at launch -
	the value given then, or the image's `defaultUser` - and the name to
	put in front of the `@`.
	"""
	loginUser: String!
	"""
	The SSH key pair this instance was launched with.
	"""
	keyPairUrn: Urn!
	"""
	Which network interfaces this instance has attached. Each carries
	only the interface's URN - for addresses, security groups and the
	rest, follow up with `network { networkInterface(urn) }`.
	"""
	networkInterfaceAttachments: [ComputeNetworkInterfaceAttachment!]!
	"""
	Which volumes this instance has attached, including which one is the
	boot volume (`isRootDevice`).
	"""
	volumeAttachments: [ComputeVolumeAttachment!]!
	"""
	Its tags, in key order.
	"""
	tags: [ResourceTag!]!
	"""
	Its `origin:name` tag, or `null` when it has none.
	"""
	name: String
}

type ComputeInstanceType {
	"""
	The canonical instance-type identifier, e.g. `"gp1.core.2"` - pass
	this directly as `instanceType` on `launchInstance`.
	"""
	instanceType: String!
	"""
	The hardware/architecture kind identifier, e.g. `"gp1"`.
	"""
	kind: String!
	"""
	The CPU-allocation-mode literal, e.g. `"core"` for dedicated,
	guaranteed vCPU vs. a future `"burst"` (shared, budget-metered) tier -
	same physical CPU/host either way, different provisioning tier, not
	a different chip.
	"""
	cpuAllocationMode: String!
	vcpu: Int!
	"""
	Memory this instance type provides, in MiB.
	"""
	memoryMib: Int!
	"""
	The most an instance of this type can read and write across all its
	volumes together, in megabits per second, reads and writes summed.
	Attaching more volumes shares this cap rather than raising it.
	`null` when the type has no cap. Applied when the instance starts.
	"""
	storageBandwidthMbit: Int
	"""
	The rate, in megabits per second, an instance of this type can burst
	to above `storageBandwidthMbit`. The burst allowance is 60 seconds of
	traffic at this rate, spent at the excess over the cap, so from a full
	allowance a burst lasts 60 × burst ÷ (burst − cap) seconds: two
	minutes when the burst is twice the cap. Staying under the cap
	refills it. `null` when the type allows no burst or has no cap.
	"""
	storageBurstBandwidthMbit: Int
	"""
	Whether a new instance can be launched as this type right now. A type
	that is listed but not available is no longer offered: `launchInstance`
	and `changeInstanceType` refuse it with `PRODUCT_UNAVAILABLE`.
	Instances already running as it keep running and keep reporting it.
	"""
	available: Boolean!
}

