type ComputeMutationSchema {
	"""
	Sets tags on an instance or one of the project's own images. A key
	the resource already carries gets the new value; its other tags are
	left alone. Returns all of the resource's tags. Requires the
	resource's `update` permission.
	"""
	setResourceTags(input: ComputeSetResourceTagsInput!): [ResourceTag!]!
	"""
	Removes tags from an instance or one of the project's own images by
	key; a key it does not carry is ignored. Returns the tags left.
	Requires the resource's `update` permission.
	"""
	removeResourceTags(input: ComputeRemoveResourceTagsInput!): [ResourceTag!]!
	createImage(input: ComputeCreateImageInput!): ComputeImage!
	"""
	Updates a customer-owned image. Public images cannot be written
	through this API - a public-shaped URN is refused rather than
	silently ignored.
	"""
	updateImage(input: ComputeUpdateImageInput!): ComputeImage!
	"""
	Deletes a customer-owned image. Platform-provided images cannot be
	deleted through this API - a public-shaped URN is refused.
	"""
	deleteImage(input: ComputeDeleteImageInput!): CommandRequestStatus!
	importKeyPair(input: ComputeImportKeyPairInput!): ComputeKeyPair!
	"""
	Generates an SSH key pair on the platform: the public half is stored
	and usable at launch exactly like an imported key, and the private
	half is returned in this response and never again. Use this when you
	do not already have a key to import. The key is `ssh-ed25519`.
	"""
	generateKeyPair(input: ComputeGenerateKeyPairInput!): ComputeGeneratedKeyPair!
	deleteKeyPair(input: ComputeDeleteKeyPairInput!): CommandRequestStatus!
	launchInstance(input: ComputeLaunchInstanceInput!): ComputeInstance!
	"""
	Starts a stopped or failed instance. It keeps its identity, its
	addresses and its volumes; a durable-backed instance may come back
	on a different machine.
	
	Asking for an instance that is already running reports success and
	changes nothing. Asking for one that is already starting re-sends
	the request it is waiting on rather than issuing a second one, so a
	retry can never disturb a guest that is coming up.
	
	Refused while the instance is still initializing — it starts on its
	own once its volumes and network interface are ready — and while it
	is stopping or terminating.
	"""
	startInstance(input: ComputeStartInstanceInput!): CommandRequestStatus!
	"""
	Changes a stopped instance's type, so it starts again at a
	different size.
	
	The instance must be stopped, and must not still hold capacity on a
	host — an instance that stopped because it failed keeps its host
	until it is terminated, and changing its type then would leave the
	platform accounting for a size it never had.
	
	Nothing else about the instance changes: it keeps its identity, its
	address and its volumes. Growing to a larger type is checked against
	the same vCPU quota a launch is; shrinking is not.
	"""
	changeInstanceType(input: ComputeChangeInstanceTypeInput!): CommandRequestStatus!
	stopInstance(input: ComputeStopInstanceInput!): CommandRequestStatus!
	terminateInstance(input: ComputeTerminateInstanceInput!): CommandRequestStatus!
	"""
	Attaches an available volume to an instance, running or stopped. The
	volume must be in the instance's own project and availability zone.
	When `deviceName` is omitted the platform assigns the first free
	device name; either way the returned attachment reports the name the
	guest sees the disk under.
	
	On a stopped instance the attachment is returned `ATTACHED`, and the
	disk appears inside the guest at the next start. On a running instance
	the disk is added live: the attachment is returned `ATTACHING`, moves
	to `ATTACHED` once the guest sees the device, and to `FAILED` if the
	device could not be added - in which case the volume is released.
	Where live attach is not available, a running instance is refused
	with a conflict asking you to stop it first.
	
	Fails when the instance is neither running nor stopped, when the
	volume is not available, or when the requested device name is taken.
	"""
	attachVolume(input: ComputeAttachVolumeInput!): ComputeVolumeAttachment!
	"""
	Detaches a volume from an instance, running or stopped. The volume
	becomes available again - attachable to another instance, or
	deletable - and the attachment is kept for history in `DETACHED`
	state with its volume reference cleared.
	
	On a running instance the device is removed live: the attachment
	reports `DETACHING` until the guest releases it, and the volume
	becomes available only after that. If the guest does not release it,
	the attachment returns to `ATTACHED` and the volume stays attached.
	Where live detach is not available, a running instance is refused
	with a conflict asking you to stop it first.
	
	The instance's root volume cannot be detached.
	"""
	detachVolume(input: ComputeDetachVolumeInput!): ComputeVolumeAttachment!
}

