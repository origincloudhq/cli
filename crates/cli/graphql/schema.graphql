type StorageMutationSchema {
	"""
	Sets tags on a volume or snapshot. A key the resource already
	carries gets the new value; its other tags are left alone. Returns
	all of the resource's tags. Requires the resource's `update`
	permission.
	"""
	setResourceTags(input: PvsSetResourceTagsInput!): [ResourceTag!]!
	"""
	Removes tags from a volume or snapshot by key; a key it does not
	carry is ignored. Returns the tags left. Requires the resource's
	`update` permission.
	"""
	removeResourceTags(input: PvsRemoveResourceTagsInput!): [ResourceTag!]!
	createVolume(input: PvsCreateVolumeInput!): PvsVolume!
	"""
	Imports an existing disk image as a new volume's initial content,
	instead of creating an empty volume. `sourceUrl` must be reachable
	over HTTP(S) from the platform.
	
	Requires the same permission as creating a volume.
	"""
	importVolume(input: PvsImportVolumeInput!): PvsVolume!
	deleteVolume(input: PvsDeleteVolumeInput!): CommandRequestStatus!
	resizeVolume(input: PvsResizeVolumeInput!): CommandRequestStatus!
	createSnapshot(input: PvsCreateSnapshotInput!): PvsSnapshot!
	protectSnapshot(input: PvsProtectSnapshotInput!): CommandRequestStatus!
	"""
	Lifts a snapshot's protection so it can be deleted; an unprotected
	snapshot can no longer be the source of a new volume or image.
	Accepted for a `COMPLETED` or `ERROR` snapshot and completed
	asynchronously: `protectionStatus` reads `UNPROTECTING`, then
	`UNPROTECTED`. Refused with a `CONFLICT` naming them while any image
	is built from the snapshot, since every launch from such an image
	clones it, or while any volume not `DELETED` was created from it;
	delete those images and volumes first. Requires
	`pvs.snapshot.unprotect` on the snapshot.
	"""
	unprotectSnapshot(input: PvsUnprotectSnapshotInput!): CommandRequestStatus!
	"""
	Deletes a snapshot, which must be `UNPROTECTED` first. Completed
	asynchronously: `status` reads `DELETING`, then `DELETED`. Refused
	with a `CONFLICT` naming them while any image is built from the
	snapshot; delete those images first. Requires `pvs.snapshot.delete`
	on the snapshot.
	"""
	deleteSnapshot(input: PvsDeleteSnapshotInput!): CommandRequestStatus!
}

type StorageQuerySchema {
	volumes(input: PvsListVolumesInput!): [PvsVolume!]!
	volume(volumeUrn: Urn!): PvsVolume
	snapshots(input: PvsListSnapshotsInput!): [PvsSnapshot!]!
	snapshot(snapshotUrn: Urn!): PvsSnapshot
	"""
	The catalog of storage classes - identifier, display name, backing
	media, which one is the default, and whether each can be selected
	right now. Pick one whose `available` is true and pass its
	`storageClass` string to `createVolume` or `importVolume`.
	
	Platform-wide and not scoped to an organisation or project; no
	permission is required. Every published tier is listed, including
	ones that are not yet on sale - check `available` rather than
	assuming everything returned can be selected.
	"""
	storageClasses: [PvsStorageClass!]!
}

