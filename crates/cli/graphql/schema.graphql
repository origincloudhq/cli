"""
A VPC's routing decisions, and the resource a subnet is associated with
to inherit them.

Every VPC has exactly one *main* table, created with it. Additional
tables let different subnets of one VPC route differently — the pattern
behind a public subnet (reaching the internet through a gateway) and a
private one (reaching only the VPC).
"""
type NetworkRouteTable {
	id: ID!
	urn: Urn!
	vpcId: String!
	"""
	The table a subnet uses when it has been associated with no other.
	Created with the VPC and cannot be deleted.
	"""
	isMain: Boolean!
	routes: [NetworkRouteTableRoute!]!
	createdAt: DateTime!
	"""
	Its tags, in key order.
	"""
	tags: [ResourceTag!]!
	"""
	Its `origin:name` tag, or `null` when it has none.
	"""
	name: String
}

"""
One routing decision: traffic for `destination` leaves via `target`.
"""
type NetworkRouteTableRoute {
	"""
	CIDR, e.g. `0.0.0.0/0` for the default route.
	"""
	destination: String!
	target: NetworkRouteTarget!
	"""
	The URN of the resource the traffic leaves through. `null` for
	`LOCAL`, which names no resource.
	"""
	targetUrn: Urn
}

"""
One route. `targetUrn` is required for `INTERNET_GATEWAY` and must be
omitted for `LOCAL`, which names no resource.
"""
input NetworkRouteTableRouteInput {
	"""
	CIDR, e.g. `0.0.0.0/0`.
	"""
	destination: String!
	target: NetworkRouteTarget!
	targetUrn: Urn
}

"""
Where a route sends traffic.
"""
enum NetworkRouteTarget {
	"""
	Inside the VPC itself. Present on every table and not removable —
	reaching your own VPC is not optional.
	"""
	LOCAL
	"""
	Out through the VPC's Internet Gateway.
	"""
	INTERNET_GATEWAY
	"""
	Out through a NAT gateway, which translates the traffic to its own
	address. Instances in a subnet routed this way reach the internet
	without each needing a Floating IP, and are not reachable from it.
	"""
	NAT_GATEWAY
}

