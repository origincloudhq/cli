	The account to create on the guest and inject the key pair into,
	overriding the image's `defaultUser` for this instance only. A POSIX
	username: lowercase letters, digits, underscore and hyphen, at most
	32 characters, starting with a letter or underscore, and not `root`.
	Omit to take the image's `defaultUser`. Whichever applies is fixed
	for the instance's life and reported as its `loginUser`.
