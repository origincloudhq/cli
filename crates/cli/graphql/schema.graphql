type NetworkMutationSchema {
	"""
	Sets tags on a resource. A key the resource already carries gets the
	new value; its other tags are left alone. Returns all of the
	resource's tags. Supported on every network resource except DNS
	policies. Requires the resource's `update` permission.
	"""
	setResourceTags(input: NetworkSetResourceTagsInput!): [ResourceTag!]!
	"""
	Removes tags from a resource by key; a key it does not carry is
	ignored. Returns the tags left. Supported on every network resource
	except DNS policies. Requires the resource's `update` permission.
	"""
	removeResourceTags(input: NetworkRemoveResourceTagsInput!): [ResourceTag!]!
	createVpc(input: NetworkCreateVpcInput!): NetworkVpc!
	createSubnet(input: NetworkCreateSubnetInput!): NetworkSubnet!
	"""
	Attaches a new Internet Gateway to a VPC, making its subnets
	internet-facing. A newly created VPC has none by default - see
	`createVpc`. Idempotent: attaching to a VPC that already has one
	returns the existing gateway unchanged.
	"""
	attachInternetGateway(input: NetworkAttachInternetGatewayInput!): NetworkInternetGateway!
	"""
	Detaches a VPC's Internet Gateway, making its subnets private again.
	Idempotent: detaching a VPC with no gateway attached is a no-op.
	Returns whether a gateway was actually detached.
	"""
	detachInternetGateway(input: NetworkDetachInternetGatewayInput!): Boolean!
	"""
	Deletes a VPC and everything it owns - subnets, ACLs, security
	groups, route tables, and its Internet Gateway if one is attached -
	then releases its claimed IPv6 CIDRs back to the pool.
	
	Refuses while any subnet still has a live network interface
	attached, and while any NAT gateway lives in the VPC - a gateway is
	never deleted with it, since it holds a Floating IP and is billed
	until `deleteNatGateway` removes it.
	"""
	deleteVpc(input: NetworkDeleteVpcInput!): Boolean!
	"""
	Deletes a subnet. Refuses while it still has a live network interface
	attached, and while a NAT gateway lives in it (see `deleteVpc`).
	
	Never releases the owning VPC's CIDR capacity - that happens only on
	`deleteVpc`.
	"""
	deleteSubnet(input: NetworkDeleteSubnetInput!): Boolean!
	"""
	Reassigns which ACL enforces a subnet's traffic - how a non-default
	ACL from `createAcl` is actually put to use. Refuses if `aclUrn`
	belongs to a different VPC than the subnet.
	"""
	updateSubnetAcl(input: NetworkUpdateSubnetAclInput!): NetworkSubnet!
	"""
	Changes whether instances launched into this subnet automatically get
	a Floating IP.
	
	Applies only to network interfaces created after the change. Existing
	interfaces keep whatever Floating IP state they have - use
	`associateFloatingIp`/`disassociateFloatingIp` for those.
	"""
	updateSubnetAutoAssignPublicIp(input: NetworkUpdateSubnetAutoAssignPublicIpInput!): NetworkSubnet!
	createNetworkInterface(input: NetworkCreateNetworkInterfaceInput!): NetworkInterface!
	"""
	Deletes a standalone network interface. Refuses while it is
	`ATTACHED`: an attached interface was created by an instance launch
	and is deleted when that instance is terminated.
	"""
	deleteNetworkInterface(input: NetworkDeleteNetworkInterfaceInput!): Boolean!
	"""
	Turns the source-address check on or off for a network interface and
	returns the interface.
	
	The check drops anything the interface sends from a MAC or IP
	address that is not the interface's own. Turn it off for an instance
	that legitimately sends from other addresses: a router or NAT
	instance, a Kubernetes node routing pod traffic, or a holder of a
	floating virtual IP (VRRP, keepalived). With the check off, the
	interface can send from any address.
	
	A change reaches a running instance within seconds, without a stop
	and start. Setting the value the interface already has succeeds and
	changes nothing. Fails with `NOT_FOUND` if the interface does not
	exist.
	"""
	setNetworkInterfaceSourceAddressCheck(input: NetworkSetNetworkInterfaceSourceAddressCheckInput!): NetworkInterface!
	"""
	Replaces the security groups a network interface carries with
	`securityGroupUrns`, the whole list: a group left out is removed,
	and a group named twice is carried once.
	
	A change reaches a running instance within seconds, without a stop
	and start. Rules in other groups that name an added or removed group
	as their peer follow the change too.
	
	Fails with `BAD_REQUEST` if the list is empty, or names a
	security group that does not exist or belongs to a different VPC
	than the interface. Fails with `NOT_FOUND` if the interface does not
	exist.
	"""
	setNetworkInterfaceSecurityGroups(input: NetworkSetNetworkInterfaceSecurityGroupsInput!): NetworkInterface!
	"""
	Creates a NAT gateway so instances without a public address of their
	own can reach the internet.
	
	It goes in a **public** subnet — one whose route table has a default
	route to an Internet Gateway — and uses a Floating IP you have
	already allocated and not attached to anything. Point a private
	subnet's route table at it to send that subnet's traffic through it:
	a `0.0.0.0/0` route with a `NAT_GATEWAY` target.
	
	A gateway translates IPv4 only. IPv6 needs no translation and leaves
	through the Internet Gateway.
	
	The Floating IP stays yours; deleting the gateway does not release
	it.
	"""
	createNatGateway(input: NetworkCreateNatGatewayInput!): NetworkNatGateway!
	"""
	Deletes a NAT gateway. Refuses while any route table still routes
	through it — repoint those first, or the subnets behind it lose
	their internet access with a route naming something that no longer
	exists. The Floating IP it used stays allocated to you.
	"""
	deleteNatGateway(input: NetworkDeleteNatGatewayInput!): Boolean!
	"""
	Creates an additional route table in a VPC.
	
	It starts with the VPC's local routes and no default route, so a
	subnet associated with it reaches its own VPC and nothing else. Add
	a default with `updateRouteTableRoutes`.
	"""
	createRouteTable(input: NetworkCreateRouteTableInput!): NetworkRouteTable!
	"""
	Replaces a route table's routes with the list given — this is not a
	patch. Send every route the table should have.
	
	An `INTERNET_GATEWAY` route must name a gateway attached to this
	table's own VPC.
	
	A `NAT_GATEWAY` route must name a gateway in this table's own VPC,
	and its destination must be `0.0.0.0/0`: a NAT gateway carries a
	subnet's whole way out, and translates IPv4 only. An IPv6 or
	narrower destination is refused rather than accepted and ignored.
	"""
	updateRouteTableRoutes(input: NetworkUpdateRouteTableRoutesInput!): NetworkRouteTable!
	"""
	Deletes a route table. A VPC's main table cannot be deleted, and
	neither can one a subnet is still associated with.
	"""
	deleteRouteTable(input: NetworkDeleteRouteTableInput!): Boolean!
	"""
	Points a subnet at a route table, replacing whichever one it used
	before. The table must belong to the subnet's own VPC.
	"""
	associateRouteTable(input: NetworkAssociateRouteTableInput!): NetworkSubnet!
	"""
	Creates an additional, non-default ACL in a VPC, for enforcing
	different rules on a subset of its subnets. Every VPC already has one
	default ACL, created with it and shared by every subnet.
	
	Starts with an empty rule list and enforces nothing until you add
	rules with `updateAclRules` and attach it with `updateSubnetAcl`.
	"""
	createAcl(input: NetworkCreateAclInput!): NetworkAcl!
	"""
	Deletes a non-default ACL.
	
	Refuses to delete a VPC's default ACL: every subnet is created with
	it unless reassigned, and it is removed only as part of `deleteVpc`.
	Also refuses while any subnet still has this ACL assigned.
	"""
	deleteAcl(input: NetworkDeleteAclInput!): Boolean!
	"""
	Replaces an ACL's rules wholesale. Enforcement is picked up by
	whichever subnet(s) are associated with this ACL (`Subnet.aclUrn`),
	not by the owning VPC directly.
	"""
	updateAclRules(input: NetworkUpdateAclRulesInput!): NetworkAcl!
	"""
	Creates an additional, non-default security group in a VPC. Every VPC
	already has one default security group created with it; this is for
	callers that want more.
	
	`ingressRules`/`egressRules` seed the group at creation time. Omit
	either one to start deny-by-default in that direction. Rules can be
	added or replaced later with `updateSecurityGroupRules`.
	"""
	createSecurityGroup(input: NetworkCreateSecurityGroupInput!): NetworkSecurityGroup!
	"""
	Deletes a non-default security group.
	
	Refuses to delete a VPC's default security group: instance launches
	fall back to it when none is given, and it is removed only as part of
	`deleteVpc`. Also refuses while any network interface still carries
	it: remove it from the interface with
	`setNetworkInterfaceSecurityGroups` first.
	"""
	deleteSecurityGroup(input: NetworkDeleteSecurityGroupInput!): Boolean!
	"""
	Replaces a security group's ingress/egress rules wholesale. Unlike
	ACLs, this propagates live to every already-running instance whose
	`NetworkInterface` currently has this security group attached - no
	restart needed.
	"""
	updateSecurityGroupRules(input: NetworkUpdateSecurityGroupRulesInput!): NetworkSecurityGroup!
	"""
	Creates a new, non-default DNS relay policy in a project. Use
	`setDefaultDnsPolicy` to make it the project's default, or
	`attachDnsPolicy` to point one VPC at it.
	"""
	createDnsPolicy(input: NetworkCreateDnsPolicyInput!): NetworkDnsPolicy!
	"""
	Replaces a DNS relay policy's own `relayEnabled`/`upstreamServers`
	wholesale - not which policy is default (`setDefaultDnsPolicy`) or
	which VPC(s) it backs (`attachDnsPolicy`). Propagates live to
	every compute host currently serving DNS for a VPC attached to
	this policy, same as `update_security_group_rules`.
	"""
	updateDnsPolicy(input: NetworkUpdateDnsPolicyInput!): NetworkDnsPolicy!
	"""
	Changes which policy is the project's default. Existing VPCs keep
	whatever policy they are attached to - only VPCs created afterwards
	pick up the new default.
	"""
	setDefaultDnsPolicy(input: NetworkSetDefaultDnsPolicyInput!): NetworkDnsPolicy!
	"""
	Deletes a DNS relay policy. Refuses if it is the project's default,
	or while any VPC is still attached to it.
	"""
	deleteDnsPolicy(input: NetworkDeleteDnsPolicyInput!): Boolean!
	"""
	Changes which DNS relay policy a VPC relays through. The policy must
	belong to the VPC's own project.
	"""
	attachDnsPolicy(input: NetworkAttachDnsPolicyInput!): NetworkVpc!
	"""
	Allocates a new Floating IP from the region's public IPv4 pool. It is
	unassociated until you call `associateFloatingIp`.
	"""
	allocateFloatingIp(input: NetworkAllocateFloatingIpInput!): NetworkFloatingIp!
	"""
	Points an allocated Floating IP at a `NetworkInterface`'s current
	private IPv4 address, enabling static 1:1 NAT for it. Errors if the
	Floating IP is already associated - callers must `disassociateFloatingIp`
	first.
	"""
	associateFloatingIp(input: NetworkAssociateFloatingIpInput!): NetworkFloatingIp!
	"""
	Disassociates a Floating IP from whatever it's currently pointed at,
	removing its NAT rules. Idempotent: disassociating a Floating IP that's
	already unassociated is a no-op. Returns whether it was actually
	associated beforehand.
	"""
	disassociateFloatingIp(input: NetworkDisassociateFloatingIpInput!): Boolean!
	"""
	Releases a Floating IP's address back to the zone and deletes the
	Floating IP. Refused while it is still associated:
	`disassociateFloatingIp` first.
	"""
	releaseFloatingIp(input: NetworkReleaseFloatingIpInput!): Boolean!
}

"""
Shared internet egress for instances that have no public address of
their own.

Instances in a subnet routed through a NAT gateway reach the internet as
the gateway's address, and are not reachable *from* it. That is the
difference from a Floating IP, which is one instance's own address in
both directions — and it is why a handful of instances that only need to
fetch packages no longer need one each.

It translates **IPv4 only**; see `addressFamily`.
"""
type NetworkNatGateway {
	id: ID!
	urn: Urn!
	vpcId: String!
	"""
	The public subnet the gateway lives in — the one it was created in,
	recorded rather than re-derived. Whether that subnet is still public
	can change afterwards if its route table is edited.
	"""
	subnetId: String!
	"""
	The Floating IP the gateway uses, and therefore the address every
	instance behind it appears as. It stays allocated to you and is not
	released when the gateway is deleted.
	"""
	floatingIpId: String!
	"""
	What the gateway translates: IPv4, and only IPv4.
	
	Its address is a Floating IP, which is an IPv4 address, so there is
	nothing for it to translate an IPv6 packet to. A route sending IPv6
	through a NAT gateway is refused rather than silently ignored.
	"""
	addressFamily: NetworkAddressFamily!
	createdAt: DateTime!
	"""
	Its tags, in key order.
	"""
	tags: [ResourceTag!]!
	"""
	Its `origin:name` tag, or `null` when it has none.
	"""
	name: String
}

"""
The protocol a security group or network ACL rule matches.
"""
enum NetworkProtocolInput {
	"""
	Every protocol. A port given with it is ignored.
	"""
	ANY
	TCP
	UDP
	"""
	ICMP for IPv4 peers and ICMPv6 for IPv6 peers, every type and code.
	ICMP has no ports: a rule with this protocol must leave `port` empty
	and is rejected otherwise.
	"""
	ICMP
}

