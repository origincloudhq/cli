type ComputeQuerySchema {
	images(input: ComputeListImagesInput!): [ImageType!]!
	"""
	A single image by URN. A customer-owned image requires
	`compute.image.get` on it; a public image requires no permission.
	
	A public-shaped URN cannot be used to read a customer-owned image -
	it simply resolves to `null`.
	"""
	image(imageUrn: Urn!): ImageType
	keyPairs(input: ComputeListKeyPairsInput!): [ComputeKeyPair!]!
	keyPair(keyPairUrn: Urn!): ComputeKeyPair
	instances(input: ComputeListInstancesInput!): [ComputeInstance!]!
	instance(instanceUrn: Urn!): ComputeInstance
	"""
	The attachments that reference a volume, each naming its instance -
	how to find which instance holds a volume that is `INUSE` without
	listing every instance in the project.
	
	The attachment holding the volume is the one whose `id` equals the
	volume's `claimRef`, and its `instanceUrn` is the instance. Normally
	that is the only entry, with status `ATTACHED`. Others appear while
	an attach or detach is in progress, after an attach that `FAILED`,
	and when a release was abandoned: a `RELEASE_ABANDONED` attachment
	may still hold the volume, and the platform has stopped trying to
	free it. Attachments that were detached are not listed.
	
	`volumeUrn` must belong to `projectUrn`. A volume in another project
	returns an empty list, exactly as a volume that does not exist does.
	Requires `compute.instance.list` on the project.
	"""
	volumeAttachments(input: ComputeListVolumeAttachmentsInput!): [ComputeVolumeAttachment!]!
	"""
	The full live catalog of instance types - kind, CPU allocation mode,
	vCPU, derived memory, and whether each can be launched right now.
	Pick one whose `available` is true and pass its `instanceType`
	string to `launchInstance`.
	
	Platform-wide and not scoped to an organisation or project; no
	permission is required. Every catalogued type is listed, including
	ones no longer offered - an instance running as one still reports
	that type, so it has to be describable. Check `available` rather
	than assuming everything returned can be launched.
	"""
	instanceTypes: [ComputeInstanceType!]!
	"""
	Every image family currently on offer, ordered by name.
	
	A family is a stable name that resolves to whichever image is
	current for it, so passing one to `launchInstance` as `imageFamily`
	gets the latest build without pinning an `imageId` that falls behind
	as soon as the family is rebuilt. Families that are no longer
	offered are not listed and resolve nothing; images already launched
	from them are unaffected.
	
	Platform-wide and not scoped to an organisation or project; no
	permission is required.
	"""
	imageFamilies: [ComputeImageFamily!]!
}

