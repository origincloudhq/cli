type IamMutationSchema {
	"""
	`projectId` narrows the grant to one project; omit it for an
	org-wide grant. Either way this requires org-level
	`iam.role.assign` - the project scope selects what the grant covers,
	it is not a separate permission.
	
	Fails as forbidden when the role carries a permission the caller
	does not hold itself at that scope: org-wide grants count for any
	scope, a project grant only for its own project.
	
	Fails as a bad request on `principal` when it is a revoked service
	account.
	"""
	assignRole(input: IamRoleAssignmentInput!): ActionResult!
