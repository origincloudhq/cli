"""
One line of a listing: the whole of an instance's health in one value.

Never `AVAILABLE` unless every applicable check actually passed — an
instance the platform cannot currently see reads `UNKNOWN`, not
`AVAILABLE`.
"""
enum InstanceAvailabilityValue {
	AVAILABLE
	IMPAIRED
	UNKNOWN
	NOT_APPLICABLE
}

"""
The outcome of one health check.

`INSUFFICIENT_DATA` is not a synonym for `OK`. It means the platform could
not evaluate the check — most often because the host carrying the instance
is unreachable, so the thing that would have observed it is gone. Treating
it as healthy is the one reading that actively misleads.
"""
enum InstanceCheckStatusValue {
	OK
	IMPAIRED
	INSUFFICIENT_DATA
	NOT_APPLICABLE
}

type InstanceHealthCheck {
	kind: InstanceHealthCheckKindValue!
	"""
	Derived from `kind` rather than stored, so the two can never
	disagree.
	"""
	category: InstanceHealthCheckCategoryValue!
	status: InstanceCheckStatusValue!
	"""
	When this check entered its current status. Null while nothing has
	ever observed it.
	"""
	since: DateTime
}

"""
Whose problem a failing check is — the reason checks are reported
separately rather than as a single indicator.
"""
enum InstanceHealthCheckCategoryValue {
	"""
	The platform underneath your instance. Failures here are the
	operator's to fix; there is nothing to do inside the instance.
	"""
	SYSTEM
	"""
	Your instance's own operating system and network configuration.
	Failures here are yours to fix.
	"""
	INSTANCE
}

"""
Which check this is. More kinds may be added over time; a client should
ignore a kind it does not recognise rather than failing on it.
"""
enum InstanceHealthCheckKindValue {
	"""
	Whether the host carrying this instance is reachable at all.
	"""
	HOST_REACHABLE
	"""
	What the hypervisor reports about the instance's domain.
	"""
	DOMAIN_STATE
	"""
	Whether the instance answers on the network.
	"""
	NETWORK_REACHABLE
	"""
	A report from an agent inside the guest. Only available on images
	that ship one.
	"""
	GUEST_AGENT
	"""
	Whether the machine carrying this instance still has it. `IMPAIRED`
	means the instance is no longer running there at all - unlike a
	failing `DOMAIN_STATE`, which is an instance that exists but is not
	running properly. Waiting will not bring it back: stop the instance
	and start it again.
	"""
	GUEST_PRESENT
}

type InstanceHealthChecks {
	"""
	Every check the platform reports, always present — a check with
	nothing to say reports `NOT_APPLICABLE` or `INSUFFICIENT_DATA`
	rather than being omitted, because an absent entry cannot tell you
	whether it is unsupported, unconfigured or simply not run yet.
	"""
	checks: [InstanceHealthCheck!]!
	"""
	The aggregate over `checks`, for a listing that wants one indicator
	per row. It is a convenience, not a replacement: only the individual
	checks say whether a problem is the platform's or yours.
	"""
	availability: InstanceAvailabilityValue!
}

"""
Where an instance is in its lifecycle. `INITIALIZING`, `PENDING`,
`STOPPING` and `SHUTTING_DOWN` are transitional and resolve on their
own; `TERMINATED` is final. `RUNNING`, `STOPPED` and `FAILED` change in
response to a request, and also without one. `RUNNING` goes straight to
`STOPPED` when the guest powers itself off, or when the platform
establishes that the machine it was running on failed, in which case
`statusReason` says so. Moving an instance to another machine for
maintenance stops it and starts it again elsewhere, from `RUNNING`
through `STOPPING`, `STOPPED` and `PENDING` back to `RUNNING`; a move
called off part-way leaves it `STOPPED` until it is started. `FAILED`
becomes `RUNNING` when its host confirms the start after all, and
`STOPPED` when its host reports the guest gone or its machine is taken
out of service. A transition that the host refused ends at `FAILED`,
never at the state its success would have produced - see
`statusReason`.
"""
enum InstanceStatusValue {
	INITIALIZING
	PENDING
	RUNNING
	STOPPING
	STOPPED
	SHUTTING_DOWN
	TERMINATED
	FAILED
}

"""
How far a network interface attachment has got. `INTERFACE_REQUESTED` is
a moment during launch, before the interface exists, and is the only
state in which `networkInterfaceUrn` is null; `ATTACHED` means the
interface is bound to the instance; `RELEASING` and the two terminal
states describe an instance being torn down. An attachment that has been
released keeps its record, so an instance's history stays readable after
it is gone - `RELEASE_ABANDONED` is the one to act on, and means the
platform stopped trying to release the interface and may still hold it.
"""
enum InterfaceAttachmentStatusValue {
	INTERFACE_REQUESTED
	ATTACHED
	RELEASING
	DETACHED
	RELEASE_ABANDONED
}

