to 128 characters; a value up to 256 characters. Under `origin:` only
`origin:name` (1-128 characters) and `origin:env` (`dev`, `staging`,
`qa`, `pre-prod`, `prod` or `canary`) are accepted. A resource carries at
most 50 tags.
"""
