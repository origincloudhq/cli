	statusReason: String
	"""
	`PROTECTED`, `UNPROTECTED`, either in-flight state, or `FAILED` when
	the last protect or unprotect could not be applied - in which case
	the real protection state is unknown. Only a `PROTECTED` snapshot can
	be used as a clone source.
	"""
	protectionStatus: String!
	"""
	Why the last protect or unprotect failed, when `protectionStatus` is
	`FAILED`. The snapshot's data is unaffected - retry the protect, or
	unprotect it, to settle the state again. `null` for every other
	protection status.
	"""
	protectionStatusReason: String
	progress: String!
	"""
	How far a pending snapshot has got, as a percentage. Non-null only
	while `progress` is `PENDING`.
	"""
	percentComplete: Float
	createdBy: Principal!
	"""
	Its tags, in key order.
	"""
	tags: [ResourceTag!]!
	"""
	Its `origin:name` tag, or `null` when it has none.
