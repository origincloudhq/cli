	for this family, e.g. `"ubuntu-22-04-minimal"`. Mutually exclusive
	with `imageUrn` - set exactly one.
	"""
	imageFamily: String
	"""
	Subnet the primary network interface is created in. Omit to use the
	project's default subnet, which is created on first use in a VPC that
	already has an Internet Gateway attached, with a public IP
