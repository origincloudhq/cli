	id: ID!
	urn: Urn!
	"""
	`null` only while the interface is still being created for this
	attachment (`INTERFACE_REQUESTED`), which is a moment during launch.
	Every later state carries it, including the terminal ones - a
	released interface keeps the id it had, so a detached attachment
	still says which interface it was.
	"""
	networkInterfaceUrn: Urn
	deviceIndex: Int!
	status: InterfaceAttachmentStatusValue!
}

