	Removes one role grant at exactly the given scope: `projectId`
	selects a project-scoped grant, omitting it the org-wide one.
	
	Fails as forbidden when the role carries a permission the caller
	does not hold itself at that scope, as `assignRole` does.
	
	Fails with not found, changing nothing, when the principal holds no
	grant of that role at exactly that scope.
	
	Fails with a conflict when it would remove the organisation's last
	org-wide `roles/owner` grant. Grant `roles/owner` to another member
	first; a project-scoped owner does not count.
	"""
	revokeRole(input: IamRoleAssignmentInput!): ActionResult!
	"""
	Invites someone by email, matched exactly.
	
	If an account with that address already exists the role is granted
	immediately - there is no separate acceptance step. If it does not,
	the invite is stored and applied automatically the first time that
	address signs in.
	
	Org-wide only: invites cannot be scoped to a single project.
	
	Fails as forbidden when the caller could not assign the role itself
	with `assignRole`. A pending invite is checked again when it is
	applied, and dropped if its inviter can no longer assign the role.
	"""
	inviteMember(input: IamInviteMemberInput!): ActionResult!
	"""
	Revokes every role the principal holds in the organisation, across
	every project scope - "remove this person's access" rather than
	"remove one role", which is `revokeRole`.
	
	A no-op, not an error, if they hold no grants there. Fails with a
	conflict, removing nothing, when they are the organisation's last
	org-wide owner, and as forbidden, removing nothing, when they hold a
	role the caller could not revoke with `revokeRole`.
	"""
	removeMember(input: IamRemoveMemberInput!): ActionResult!
	"""
	Cancels a pending invite before it is applied. `removeMember` acts
	only on real role assignments, so it will not cancel an invite.
	"""
	revokeInvite(input: IamRevokeInviteInput!): ActionResult!
	"""
	Creates a service account for machine-to-machine access - the
	`client_credentials` grant only, never interactive login.
	
	**The returned `clientSecret` is shown exactly once.** It cannot be
	retrieved again through this or any other API; store it now.
	
	The account starts with no roles. Grant one with `assignRole`, using
	the account's own principal.
	"""
	createServiceAccount(input: IamCreateServiceAccountInput!): IamServiceAccountCredential!
	"""
	Revokes a service account: any further `client_credentials` grant is
	rejected, and every role assignment the account holds, in any
	organisation, is removed. An access token issued before the revoke
	is refused as forbidden on its next request.
	
	Permanent: a revoked account can't be reactivated or granted roles
	again. Revoking an already revoked account succeeds.
	"""
	revokeServiceAccount(input: IamRevokeServiceAccountInput!): ActionResult!
}

