	The instance type to launch, e.g. `"gp1.core.2"` - see the
	`instanceTypes` query for the full live catalog, and pick one whose
	`available` is true. Validated server-side: an unknown value is
	rejected as invalid input, and one that exists but is no longer
	offered with `PRODUCT_UNAVAILABLE`.
