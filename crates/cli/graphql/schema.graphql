type AdministrationMutationSchema {
	"""
	Creates an organisation from its name alone, for callers that manage
	billing themselves: its default billing account starts without a
	billing profile and the organisation cannot be invoiced until
	`updateBillingAccountProfile` is called on that account.
	`registerOrganisation` does both in one call.
	"""
	createOrganisation(input: AdminCreateOrganisationInput!): Organisation!
	"""
	Creates an organisation together with the billing profile its default
	billing account is created with, so the organisation is billable from
	the start. The caller becomes the organisation's owner and billing
	administrator. Fails naming `invoice_email` when the invoice address
	is not a valid email address, and then creates nothing.
	"""
	registerOrganisation(input: AdminRegisterOrganisationInput!): Organisation!
	createProject(input: AdminCreateProjectInput!): Project!
	updateOrganisation(input: AdminUpdateOrganisationInput!): Organisation!
	updateProject(input: AdminUpdateProjectInput!): Project!
	"""
	Switches which billing account pays for this project. Requires
	`admin.project.attach`, which an organisation owner holds by
	default - distinct from the permissions governing billing accounts
	themselves.
	
	There is no unlink counterpart: a project always has a billing
	account, so this replaces the current one rather than clearing it.
	"""
	linkProjectToBillingAccount(input: AdminLinkProjectToBillingAccountInput!): Project!
	"""
	Refuses while the project still owns any resource: an instance that
	is not terminated, an image, a key pair, a volume or snapshot that is
	not deleted, a NAT gateway, a Floating IP, a VPC, or a DNS policy
	other than the project's default one. The refusal names every kind
	still owned, in the order to remove them. Nothing you can delete
	yourself is deleted on your behalf.
	
	Removes the project's default DNS policy and every role assignment
	scoped to the project, for every member and service account,
	together with the project. Org-wide role assignments are unaffected.
	"""
	deleteProject(input: AdminDeleteProjectInput!): Boolean!
	"""
	Refuses unless every project in the organisation has already been
	deleted.
	
	Billing accounts the organisation still owns are left untouched, so
	an organisation can be deleted while billing accounts with no linked
	projects remain.
	"""
	deleteOrganisation(input: AdminDeleteOrganisationInput!): Boolean!
	"""
	Billing account permissions are governed by `roles/billing/*` grants
	and are never included in an organisation owner's default
	permissions.
	
	Unlike creating an organisation or project, this grants the caller no
	role: reaching it at all means already holding
	`admin.billing_account.create`, which carries access to the resulting
	account too. An organisation's creator holds
	`roles/billing/administrator` from the moment the organisation
	exists; anyone else needs that grant assigned explicitly.
	"""
	createBillingAccount(input: AdminCreateBillingAccountInput!): BillingAccount!
	deleteBillingAccount(input: AdminDeleteBillingAccountInput!): Boolean!
	"""
	Replaces every profile field together - fields you omit are cleared,
	not preserved. Requires the same access as any other
	billing-account write.
	"""
	updateBillingAccountProfile(input: AdminUpdateBillingAccountProfileInput!): BillingAccount!
	"""
	Changes a billing account's display name and nothing else — the
	billing profile is untouched. Works on any of the organisation's
	billing accounts, the default one included. An empty or
	whitespace-only name is refused with a `BAD_REQUEST` naming
	`display_name`. Requires the same access as any other
	billing-account write.
	"""
	updateBillingAccountDisplayName(input: AdminUpdateBillingAccountDisplayNameInput!): BillingAccount!
	"""
	Begins adding a payment method to a billing account. Returns the
	payment provider's hosted page to redirect the browser to - card
	details are entered there and never pass through this API. After
	the hosted flow returns to the console, call
	`confirmPaymentMethodSetup` to verify and record the result.
	Starting again replaces any earlier unfinished setup. Refused with
	a `BAD_REQUEST` naming `billing_account_id` when the account needs
	no payment method (`paymentMethodStatus` is `NOT_REQUIRED`).
	Requires the same access as any other billing-account write.
	"""
	startPaymentMethodSetup(input: AdminStartPaymentMethodSetupInput!): PaymentMethodSetup!
	"""
	Completes a payment method setup after the hosted flow returned to
	the console. The result is verified with the payment provider
	server-side and only a finished setup is recorded - the redirect
	alone proves nothing. On success the account's
	`paymentMethodStatus` becomes `VERIFIED` and billable resources
	can be created. An unfinished or abandoned setup is refused with a
	`BAD_REQUEST` naming `billing_account_id` and the account is
	unchanged - finish the hosted page, or start a new setup. Requires
	the same access as any other billing-account write.
	"""
	confirmPaymentMethodSetup(input: AdminConfirmPaymentMethodSetupInput!): BillingAccount!
	"""
	Sets the organisation's spend limit. Setting it again replaces the
	existing limit rather than failing or adding a second one.
	
	Requires `admin.spend_limit.update`, which an organisation owner can
	grant - it does not require billing-account access.
	"""
	setSpendLimit(input: AdminSetSpendLimitInput!): SpendLimit!
	clearSpendLimit(input: AdminSpendLimitInput!): Boolean!
	"""
	Sets one dimension of a project's quota. A project quota is a
	budget the organisation imposes on itself - useful to stop one
	project consuming the whole organisation's allowance. The value may
	not be negative and may not exceed the organisation's limit for the
	same dimension; a value above that ceiling is rejected rather than
	silently capped. Budgets of several projects may sum to more than
	the organisation's quota - they are budgets, not reservations, and
	the organisation's own limit is always enforced as well.
	"""
	setProjectQuotaLimit(input: AdminSetProjectQuotaLimitInput!): ProjectQuota!
	"""
	Clears one dimension of a project's quota - the project is then
	bounded only by the organisation's quota for that dimension.
	Clearing a dimension that has no budget set succeeds and changes
	nothing.
	"""
	clearProjectQuotaLimit(input: AdminClearProjectQuotaLimitInput!): ProjectQuota!
	"""
	Opens a new support case. `contact_email` is taken from this request
	rather than from your account, and is where every notification about
	this case is sent for its lifetime - so supply an address you want
	to receive replies on.
	"""
	openSupportCase(input: AdminOpenSupportCaseInput!): SupportCase!
	"""
	Appends a message to the conversation. The case's `contact_email` is
	notified only when the author is someone other than whoever opened
	the case, so you are not emailed about your own replies.
	"""
	addSupportCaseMessage(input: AdminAddSupportCaseMessageInput!): SupportCaseMessage!
	"""
	Changes a case's resolution state. The case's `contact_email` is
	always notified, whoever made the change.
	"""
	updateSupportCaseStatus(input: AdminUpdateSupportCaseStatusInput!): SupportCase!
}

type AdministrationQuerySchema {
	projects(input: AdminListProjectsInput!): [Project!]!
	project(orgId: OrgId!, projectId: ProjectId!): Project
	"""
	The countries a billing address may use, with their display names
	and whether a VAT id is mandatory. Deliberately unauthenticated:
	the registration form needs it before any organisation exists.
	"""
	billingCountries: [BillingCountryObject!]!
	"""
	Billing accounts are governed by their own `roles/billing/*` grants,
	not by project or organisation roles. Being a project Owner is not
	sufficient to read them.
	"""
	billingAccounts(input: AdminListBillingAccountsInput!): [BillingAccount!]!
	billingAccount(orgId: OrgId!, id: BillingAccountId!): BillingAccount
	billingAccountLinkedProjects(orgId: OrgId!, id: BillingAccountId!): [Project!]!
	organisations: [Organisation!]!
	organisation(orgId: OrgId!): Organisation
	"""
	The organisation's effective quota: the platform defaults with any
	overrides applied, plus current usage for each `max*` dimension, so
	a caller can see both the limit and how much of it is consumed.
	Usage can trail a change by up to half a minute.
	
	Readable by anyone with read access to the organisation - this is
	where you read your own organisation's limits.
	"""
	organisationQuota(orgId: OrgId!): OrganisationQuota!
	"""
	The project-scoped sibling of `organisationQuota`, with one
	difference: a project has no platform-assigned limits. Each `max*`
	field is the project's own optional budget - null means no
	project-level limit for that dimension, leaving the organisation's
	quota as the only bound. Budgets are set and cleared with
	`setProjectQuotaLimit`/`clearProjectQuotaLimit`.
	"""
	projectQuota(orgId: OrgId!, projectId: ProjectId!): ProjectQuota!
	"""
	Closed usage intervals for a project overlapping `[from, to]` - the
	raw metering records the project's cost is derived from. Readable by
	anyone with read access to the project's organisation.
	"""
	usageRecords(input: AdminListUsageRecordsInput!): [UsageRecord!]!
	"""
	Priced cost for a project within `[from, to)`, bucketed by hour or
	day and grouped by service then product key. Requires the same
	access as `usageRecords`.
	"""
	usageCost(input: AdminUsageCostInput!): UsageCostReport!
	"""
	The org-wide counterpart to `usageCost`: every project in the
	organisation within `[from, to)`, returning both the
	service/product-key breakdown and a per-project split, so an
	org-level cost view needs one call rather than one per project.
	
	All-or-nothing: a caller who can read the organisation's usage reads
	every project's cost in it, not only the projects they are
	individually granted.
	"""
	orgUsageCost(input: AdminOrgUsageCostInput!): OrgUsageCostReport!
	"""
	The configured spend limit, if one is set, together with the current
	calendar month's real spend. Spend is computed fresh on every call
	rather than served from a cache.
	
	Requires `admin.spend_limit.get`, which an organisation owner can
	grant - it does not require billing-account access.
	"""
	spendLimitStatus(input: AdminSpendLimitInput!): SpendLimitStatus!
	"""
	One page of the organisation's support cases, newest first. An
	organisation's own owner or viewer can read them by default.
	
	Returns a page envelope rather than a bare list: the result is
	capped, and `total`/`hasMore` tell you whether more remain.
	"""
	supportCases(input: AdminListSupportCasesInput!): SupportCasePage!
	supportCase(orgId: OrgId!, id: SupportCaseId!): SupportCase
	"""
	One page of the conversation, oldest first. Requires the same access
	as reading the case itself - a message is not independently
	readable without it.
	
	Returns a page envelope rather than a bare list: the result is
	capped, and `total`/`hasMore` tell you whether more remain.
	"""
	supportCaseMessages(		orgId: OrgId!,		id: SupportCaseId!,
		"""
		How many messages to skip, oldest-first. Defaults to 0; a negative value is read as 0.
		"""
		offset: Int,
		"""
		Page size. Defaults to 100 and is clamped to 1..=500; the page echoes the limit actually served.
		"""
		limit: Int
	): SupportCaseMessagePage!
}

"""
The outcome of an audited action. Only `SUCCESS` entries are recorded
today; `DENIED` is part of the schema already so that logging denied
attempts later is not a breaking change.
"""
enum AuditLogOutcomeType {
	SUCCESS
	DENIED
}

type BillingAccount {
	id: ID!
	urn: Urn!
	billingAccountId: BillingAccountId!
	"""
	Human-readable name, rendered into spend-limit alert emails. The
	account an organisation is provisioned with starts out named
	`default`; any account, that one included, can be renamed with
	`updateBillingAccountDisplayName`.
	"""
	displayName: String!
	"""
	The postal address invoices are issued to. Set from the start on a
	billing account created with `createBillingAccount`, and on the
	default one provisioned by `registerOrganisation`; `null` on the
	default account of an organisation created with the name-only
	`createOrganisation` until `updateBillingAccountProfile` is called.
	"""
	billingAddress: BillingAddressObject
	invoiceEmail: String
	vatId: String
	contactPerson: String
	"""
	Whether this account can pay for resources: `NONE` until a payment
	method is added and verified (creating billable resources is
	refused in that state), `VERIFIED` once one is on file, or
	`NOT_REQUIRED` when billing is handled by the platform operator
	and no payment method is applicable.
	"""
	paymentMethodStatus: PaymentMethodStatusValue!
	"""
	The verified payment method's card brand (for example `visa`).
	`null` until a payment method is verified, and for payment methods
	that are not cards.
	"""
	paymentMethodBrand: String
	"""
	The verified payment method's last four digits. `null` until a
	payment method is verified, and for payment methods that are not
	cards.
	"""
	paymentMethodLast4: String
	orgId: OrgId!
	organisation: Organisation
	createdAt: DateTime!
	createdBy: Principal!
}

scalar BillingAccountId

"""
A billing address. Mirrors the address returned on a billing account
field-for-field.
"""
input BillingAddressInput {
	street: String!
	city: String!
	postalCode: String!
	country: String!
}

"""
A billing account's postal address.
"""
type BillingAddressObject {
	street: String!
	city: String!
	postalCode: String!
	country: String!
}

"""
A country the platform can issue invoices for. Drives the billing
address country selection: submit `code`, display `name`, and require
a VAT id whenever `vatIdRequired` is set.
"""
type BillingCountryObject {
	"""
	ISO 3166-1 alpha-2 code - the value the billing address mutations
	expect in `country`.
	"""
	code: String!
	"""
	English display name.
	"""
	name: String!
	"""
	Whether a VAT id is mandatory for this country. Invoicing outside
	Germany is business-to-business only, so every non-German country
	requires one.
	"""
	vatIdRequired: Boolean!
}

type CommandRequestStatus {
	accepted: Boolean!
	message: String!
}

input ComputeAttachVolumeInput {
	instanceUrn: Urn!
	volumeUrn: Urn!
	"""
	The guest device name to expose the volume under (`vda`..`vdz`).
	Assigned by the platform when omitted.
	"""
	deviceName: String
}

input ComputeBlockDeviceSpecInput {
	"""
	The guest device name this disk appears under on every instance
	launched from the image: a bare `vda`..`vdz` (not `vdc`, and not a
	`/dev/` path), unique within the image. Any other value is refused.
	"""
	deviceName: String!
	snapshotUrn: Urn
	sizeInGib: Int!
}

"""
What the instance's root disk should be, where it differs from the
image's own. Applies to the boot volume only; extra data disks are
created and attached separately.
"""
input ComputeBootVolumeInput {
	"""
	Size of the root disk, in GiB. Omit for the image's own size, which
	is also the smallest accepted value: a smaller size is refused
	rather than quietly raised, so the disk is always the size that was
	asked for and billed. The extra space is yours to partition; most
	images grow their root filesystem into it on first boot.
	"""
	sizeInGib: Int
	"""
	Performance tier for the root disk, e.g. `gp1`. Omit for the
	default. Validated against the tiers currently on offer, so a tier
	this returns today can stop being accepted; read `pvs.storageClasses`
	for the live list rather than hard-coding one.
	"""
	storageClass: String
}

input ComputeChangeInstanceTypeInput {
	instanceUrn: Urn!
	"""
	The type to change to, e.g. `gp1.core.4`. Must be one the platform
	currently offers; read `instanceTypes` and pick one whose `available`
	is true. A type that is no longer offered is refused with
	`PRODUCT_UNAVAILABLE`.
	"""
	instanceType: String!
}

input ComputeCreateImageInput {
	projectUrn: Urn!
	description: String!
	"""
	The account instances launched from this image log in as - the
	non-root user created at first boot, holding the launch's SSH key.
	A POSIX username: lowercase letters, digits, underscore and hyphen,
	at most 32 characters, starting with a letter or underscore, and
	not `root`. Defaults to `cloud` when omitted.
	"""
	defaultUser: String
	"""
	The guest device name of the disk the image boots from: a bare
	`vda`..`vdz` (not `vdc`, and not a `/dev/` path), and one of the
	names in `blockDeviceSpecs`. Any other value is refused.
	"""
	rootDeviceName: String!
	blockDeviceSpecs: [ComputeBlockDeviceSpecInput!]!
	"""
	Tags to create the image with. `origin:name` names it.
	"""
	tags: [ResourceTagInput!]
}

