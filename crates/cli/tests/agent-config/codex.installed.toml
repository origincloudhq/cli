# Codex configuration.
model = "gpt-5-codex"   # the default model

[mcp_servers.docs]
command = "npx"
args = ["-y", "docs-mcp"]

[mcp_servers.origincloud]
command = "origin"
args = ["mcp", "serve", "--toolsets", "pvs,location", "--read-only"]

# Keep this one last.
[profiles.fast]
model = "gpt-5-mini"
