[package]
name = "origincloud-cli"
version = "1.19.0"
# Shown as the summary line of `origin --help`.
description = "Command-line interface for Origin Cloud"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "origin"
path = "bin/origin.rs"

[lib]
path = "src/lib.rs"

[dependencies]
origincloud-oauth-login = { path = "../oauth-login" }
origincloud-mcp.workspace = true
origincloud-core.workspace = true
origincloud-pvs.workspace = true
origincloud-location.workspace = true
origincloud-compute.workspace = true
origincloud-network.workspace = true
origincloud-resourcemanager.workspace = true
origincloud-iam.workspace = true
origincloud-billing.workspace = true
origincloud-support.workspace = true
origincloud-observability.workspace = true
origincloud-dns.workspace = true
origincloud-sts.workspace = true
# A message field's JSON flag checks its value against the API's
# descriptors, which the generator checks in beside the commands.
prost-reflect = "0.16"
# The tests' scratch service, whose command group the `test-services`
# feature compiles in: see testing/scratch/.
origincloud-scratch = { path = "../../testing/scratch/sdk", optional = true }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# `origin completion` writes the shell completion scripts.
clap_complete = "4"
# `origin __commands` names a generated command's method as the generator
# names the command after it.
heck = "0.5"
expanduser = "1"
graphql_client.workspace = true
# `origin mcp serve` serves the MCP tools on standard input and output.
rmcp = { workspace = true, features = ["transport-io"] }
# `origin mcp install` edits the coding agents' files, keeping their
# comments and layout: JSON (with comments) and TOML.
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
toml_edit = "0.22"
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
# The human output formats: colour that turns itself off where it can't be
# shown (`NO_COLOR`, a pipe, `--color`), and the width a table is laid out
# to.
anstream = "1.0.0"
anstyle = "1.0.14"
unicode-width = "0.1.14"

# The terminal's width, which a table is fitted to. Windows has no lookup:
# `COLUMNS` gives one there, and without it a table isn't cut to fit.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["termios"] }

[features]
# Adds `origin scratch`, the command group of a service that exists only in
# the tests, whose fields the published API doesn't have yet: nested and
# repeated messages, repeated scalars. Never built into a release.
test-services = ["dep:origincloud-scratch"]

[dev-dependencies]
# The credential tests write an unsigned JWT with an expiry in the past.
base64.workspace = true
fake-server.workspace = true
# The coverage and generated-command tests read the API descriptors the
# generator checked in, and its table of choices.
serde.workspace = true
toml = "0.8"
# The config-path tests resolve against a real directory tree, so they need a
# throwaway one: they must never touch the developer's own ~/.config.
tempfile = "3.16"
