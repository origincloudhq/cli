# The SDK crate of the tests' scratch service (testing/scratch/origincloud/),
# its code generated by the Rust SDK's own generator, at the commit
# Cargo.lock pins, by scripts/generate.sh. Only the CLI's `test-services`
# feature uses it.
[package]
name = "origincloud-scratch"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false
description = "The SDK crate of the CLI tests' scratch service."

[dependencies]
origincloud-core.workspace = true
pbjson = "0.9"
prost = "0.14"
serde = "1"
